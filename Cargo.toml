[package]
edition = "2021"
name = "voxl-server"
version = "0.3.2"
build = "build.rs"
links = "voxl"
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/build.rs",
    "/src",
    "/web",
    "/README.md",
    "/LICENSE",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Low-latency desktop streaming for the browser: an X11 display or a Mac's screen as H.264 over a WebSocket"
readme = "README.md"
keywords = [
    "remote-desktop",
    "streaming",
    "x11",
    "h264",
    "websocket",
]
categories = [
    "command-line-utilities",
    "multimedia::video",
]
license = "MIT"
repository = "https://github.com/tembo/voxl"

[lib]
name = "voxl"
path = "src/lib.rs"

[[bin]]
name = "voxl"
path = "src/main.rs"

[dependencies.axum]
